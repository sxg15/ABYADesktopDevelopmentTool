<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>描边与按钮两态核对</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#fff5e7;color:#603d29;font-family:'Microsoft YaHei',sans-serif;width:960px}h1{font-size:24px;margin:0 0 12px}p{font-size:15px;line-height:1.6}.hud{position:relative;width:440px;height:116px;margin:24px 0;background:#f3ccaa}.timer-panel{position:absolute;left:28px;top:24px;width:196px;height:75px}.timer-icon{position:absolute;left:16px;top:11px;width:76px;height:88px}.timer{position:absolute;left:95px;top:24px;width:118px;height:75px;display:grid;place-items:center;font-size:40px;font-weight:700;color:#fff6e7;-webkit-text-stroke:2.4px #468c89;paint-order:stroke fill}.round-panel,.round-text{position:absolute;left:240px;top:24px;width:194px;height:74px}.round-text{display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff5e5;-webkit-text-stroke:1.6px #9e6640;paint-order:stroke fill}.samples{display:flex;gap:24px}.sample{width:270px}.pair{display:flex;gap:30px;padding:24px 12px 12px}.item{height:116px;position:relative}.caption{font-size:14px;margin:8px 0}.button{position:relative;flex:none}.skin{position:absolute;left:0;width:100%;height:auto}.key{position:absolute;left:-10px;top:-16px;width:44px;height:44px;border:3px solid #b38360;border-radius:50%;background:white;color:#603d29;font-size:18px;font-weight:700;display:grid;place-items:center;z-index:3}.symbol{position:absolute}.reset{width:30px;height:31.8px;transform:translate(-50%,-50%)}.arrow{left:13%;width:74%;height:70%}.symbol svg{width:100%;height:100%;display:block}.choice{position:absolute;left:0;width:128px;height:44px;line-height:44px;font-size:21px;font-weight:700;text-align:center}.bottom-guide{position:absolute;left:0;width:100%;border-bottom:1px dashed #468c89;pointer-events:none}small{display:block;line-height:1.7;font-size:13px}button.control{font:inherit;background:#fff;border:1px solid #9e6640;padding:8px 16px;cursor:pointer;margin:0 8px 16px 0}
</style>
<h1>倒计时／轮数描边 · 按钮按下向下对齐</h1>
<p>局部规格核对页；不是玩法整屏图或实机证据。数值来自 play-ui-layout.md，所有控件按基准尺寸显示。</p>
<div class="hud"><img class="timer-panel" src="timer-panel.png"><img class="timer-icon" src="timer-icon.png"><div class="timer">20</div><img class="round-panel" src="round-panel.png"><div class="round-text">轮数：1</div></div>
<button class="control" onclick="document.querySelector('.timer').textContent=['20','10','9','0'][(++ti)%4]">切换秒数</button><button class="control" onclick="document.querySelector('.round-text').textContent=(ri=!ri)?'轮数：10':'轮数：1'">切换轮数</button>
<div class="samples"></div>
<p id="result"></p><small>皮肤底边以常态原图实际高度为基准；白圈、槽和命中范围不动。按下图自身变矮，图标/文字仅向下平移，松开恢复。</small>
<script>
let ti=0,ri=false;
const reset='<svg viewBox="14.5 8.5 50 53"><path d="M18 22 H46 C66 22 66 58 46 58 H18 M28 12 L18 22 L28 32" fill="none" stroke="#75492f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const arrow='<svg viewBox="0 0 80 80"><path d="M40 16 L20 37 H32 V61 H48 V37 H60 Z" fill="#75492f"/></svg>';
const specs=[{type:'round',name:'圆形重置',w:88,h:88,k:88/187,hn:184,hp:176,delta:2.1176470588,key:'R'},{type:'square',name:'方形方向',w:76,h:76,k:76/153,hn:153,hp:145,delta:4*76/153,key:'W'},{type:'rectangle',name:'长方形选项',w:128,h:77,k:128/255,hn:153,hp:145,delta:4*128/255,key:'1'}];
for(const s of specs){const el=document.createElement('section');el.className='sample';el.innerHTML='<h2 style="font-size:18px">'+s.name+'</h2><div class="pair"></div><small>皮肤上边：0 → '+(8*s.k).toFixed(4)+'<br>共同底边：'+(s.hn*s.k).toFixed(4)+'<br>内容中心下移：'+s.delta.toFixed(4)+'</small>';document.querySelector('.samples').append(el);for(const pressed of [false,true]){const item=document.createElement('div');item.className='item';item.style.width=s.w+'px';const y=pressed?8*s.k:0,dy=pressed?s.delta:0;item.innerHTML='<div class="button" data-type="'+s.type+'" data-state="'+(pressed?'pressed':'normal')+'" style="width:'+s.w+'px;height:'+s.h+'px"><img class="skin" style="top:'+y+'px" src="'+s.type+'-'+(pressed?'pressed':'normal')+'.png"><i class="bottom-guide" style="top:'+(s.hn*s.k)+'px"></i><b class="key">'+s.key+'</b></div><p class="caption">'+(pressed?'按下':'常态')+'</p>';el.querySelector('.pair').append(item);const b=item.querySelector('.button');const c=document.createElement('div');c.className='content '+(s.type==='round'?'symbol reset':s.type==='square'?'symbol arrow':'choice');if(s.type==='round'){c.style.left='43.5294117647px';c.style.top=(36.7058823529+dy)+'px';c.innerHTML=reset;}else if(s.type==='square'){c.style.top=(.08*76+dy)+'px';c.innerHTML=arrow;}else{c.style.top=(12+dy)+'px';c.textContent='较小';}b.insertBefore(c,b.querySelector('.key'));}}
window.addEventListener('load',()=>{const failures=[];for(const s of specs){const n=document.querySelector('[data-type="'+s.type+'"][data-state="normal"]'),p=document.querySelector('[data-type="'+s.type+'"][data-state="pressed"]');const rel=(b,cls)=>{const x=b.querySelector(cls).getBoundingClientRect(),r=b.getBoundingClientRect();return {bottom:x.bottom-r.top,cy:(x.top+x.bottom)/2-r.top,w:x.width,h:x.height}};const a=rel(n,'.skin'),b=rel(p,'.skin'),c=rel(n,'.content'),d=rel(p,'.content');if(Math.abs(a.bottom-b.bottom)>.03||d.cy<=c.cy||Math.abs(c.w-d.w)>.01||Math.abs(c.h-d.h)>.01||rel(n,'.key').cy!==rel(p,'.key').cy)failures.push(s.type);}document.querySelector('#result').textContent=failures.length?'检查失败：'+failures.join(', '):'浏览器几何检查通过：三种皮肤底边固定，内容中心下移且尺寸不变，白圈固定。';});
</script></html>
