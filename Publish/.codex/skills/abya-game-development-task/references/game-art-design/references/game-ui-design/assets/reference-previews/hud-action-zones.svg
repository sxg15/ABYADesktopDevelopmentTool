<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#527b8a"/></marker></defs><rect width="960" height="600" fill="#edf2f4"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="40" y="42" font-size="26" fill="#263c48">HUD：信息与操作职责</text><text x="40" y="72" font-size="15" fill="#526a76">按玩法推导关系；位置、形状与尺寸均需重新设计</text><rect x="40" y="92" width="880" height="370" rx="6" fill="#dce6eb" stroke="#879da8" stroke-width="2"/><text x="62" y="122" font-size="17" fill="#263c48">游戏视野 / 真实镜头与内容</text><rect x="62" y="142" width="206" height="62" rx="6" fill="#fff" stroke="#879da8" stroke-width="2"/><text x="78" y="170" font-size="19" fill="#263c48">持续信息</text><text x="78" y="191" font-size="15" fill="#263c48">状态、资源等</text><rect x="664" y="142" width="230" height="62" rx="6" fill="#fff" stroke="#879da8" stroke-width="2"/><text x="680" y="170" font-size="19" fill="#263c48">事件 / 方向信息</text><text x="680" y="191" font-size="15" fill="#263c48">来源与重要性要清楚</text><rect x="300" y="205" width="340" height="120" rx="6" fill="#f8fbfc" stroke="#a1b4bd" stroke-width="2"/><text x="332" y="251" font-size="23" fill="#263c48">主玩法注意力区</text><text x="332" y="285" font-size="17" fill="#263c48">保护角色、目标与操作判断</text><rect x="568" y="358" width="326" height="82" rx="6" fill="#fff" stroke="#879da8" stroke-width="2"/><text x="588" y="389" font-size="20" fill="#263c48">动作与即时反馈</text><text x="588" y="417" font-size="16" fill="#263c48">按当前输入安排，避开遮挡</text><path d="M470 345 L568 383" fill="none" stroke="#527b8a" stroke-width="2"  marker-end="url(#arrow)"/><text x="62" y="500" font-size="18" fill="#263c48">不是固定四角布局：信息随对象、频率与镜头重新分配。</text><text x="62" y="532" font-size="17" fill="#263c48">纸纹、阴影和装饰不得吞掉焦点、数值、目标或触控区域。</text><text x="40" y="570" font-size="15" fill="#526a76">原创结构假设 · 非真实游戏截图 · 非字体规格或策划认可案例</text></g></svg>