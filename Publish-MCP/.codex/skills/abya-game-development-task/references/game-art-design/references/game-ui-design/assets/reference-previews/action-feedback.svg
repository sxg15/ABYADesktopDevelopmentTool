<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#527b8a"/></marker></defs><rect width="960" height="600" fill="#edf2f4"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="40" y="42" font-size="26" fill="#263c48">组件反馈：输入、执行与结果</text><text x="40" y="72" font-size="15" fill="#526a76">按玩法推导关系；位置、形状与尺寸均需重新设计</text><rect x="40" y="155" width="158" height="92" rx="6" fill="#fff" stroke="#879da8" stroke-width="2"/><text x="60" y="192" font-size="20" fill="#263c48">可用</text><text x="60" y="224" font-size="14" fill="#263c48">明确可操作</text><path d="M198 200 L220 200" fill="none" stroke="#527b8a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="220" y="155" width="158" height="92" rx="6" fill="#fff" stroke="#879da8" stroke-width="2"/><text x="240" y="192" font-size="20" fill="#263c48">输入回执</text><text x="240" y="224" font-size="14" fill="#263c48">立即看见响应</text><path d="M378 200 L400 200" fill="none" stroke="#527b8a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="400" y="155" width="158" height="92" rx="6" fill="#fff" stroke="#879da8" stroke-width="2"/><text x="420" y="192" font-size="20" fill="#263c48">执行中</text><text x="420" y="224" font-size="14" fill="#263c48">只在实际需要时</text><path d="M558 200 L580 200" fill="none" stroke="#527b8a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="580" y="155" width="158" height="92" rx="6" fill="#dcebdc" stroke="#879da8" stroke-width="2"/><text x="600" y="192" font-size="20" fill="#263c48">结果反馈</text><text x="600" y="224" font-size="14" fill="#263c48">成功 / 失败</text><path d="M738 200 L760 200" fill="none" stroke="#527b8a" stroke-width="2"  marker-end="url(#arrow)"/><rect x="760" y="155" width="158" height="92" rx="6" fill="#fff" stroke="#879da8" stroke-width="2"/><text x="780" y="192" font-size="20" fill="#263c48">下一步</text><text x="780" y="224" font-size="14" fill="#263c48">继续 / 重试</text><text x="62" y="306" font-size="18" fill="#263c48">失败说明可恢复的原因；取消与返回有可预测去向。</text><rect x="220" y="367" width="520" height="72" rx="6" fill="#f4f8fa" stroke="#879da8" stroke-width="2"/><text x="246" y="398" font-size="18" fill="#263c48">装饰与庆祝动画：按需播放、可取消或替换</text><text x="246" y="423" font-size="16" fill="#263c48">玩法判定、数值更新和连续输入不等待它结束</text><path d="M299 247 L299 367" fill="none" stroke="#527b8a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M740 403 L839 247" fill="none" stroke="#527b8a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="62" y="500" font-size="17" fill="#263c48">这是关系示意；不要求所有控件都具有加载、失败或庆祝状态。</text><text x="40" y="570" font-size="15" fill="#526a76">原创结构假设 · 非真实游戏截图 · 非字体规格或策划认可案例</text></g></svg>